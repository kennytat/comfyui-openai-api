services:
  comfyui:
    image: yanwk/comfyui-boot:cu130-megapak-pt211
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ports:
      - "127.0.0.1:8188:8188"
      - "127.0.0.1:8390:8390"
    # Host RAM cap for ComfyUI (weights are staged in host RAM: ~20 GB with a Flux model,
    # ~32 GB with qwen-image). A runaway allocation then OOM-kills only this container.
    mem_limit: ${COMFYUI_MEM_LIMIT:-40g}
    memswap_limit: ${COMFYUI_MEM_LIMIT:-40g}
    environment:
      CLI_ARGS: "--fast fp16_accumulation cublas_ops"
      HF_TOKEN: ${HF_TOKEN}
    # Visibility only (docker compose ps); the gateway does not gate on it.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8188/system_stats >/dev/null || python3 -c \"import urllib.request;urllib.request.urlopen('http://localhost:8188/system_stats')\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 180s
    volumes:
      - ./comfyui/storage-cache/dot-cache:/root/.cache
      - ./comfyui/storage-cache/dot-config:/root/.config
      - ./comfyui/storage-nodes/dot-local:/root/.local
      - ./comfyui/storage-nodes/custom_nodes:/root/ComfyUI/custom_nodes
      - ./comfyui/storage-models/models:/root/ComfyUI/models
      - ./comfyui/storage-models/hf-hub:/root/.cache/huggingface/hub
      - ./comfyui/storage-models/torch-hub:/root/.cache/torch/hub
      - ./comfyui/storage-user/input:/root/ComfyUI/input
      - ./comfyui/storage-user/output:/root/ComfyUI/output
      - ./comfyui/storage-user/user-profile:/root/ComfyUI/user
      - ./comfyui/storage-user/user-scripts:/root/user-scripts


  gateway:
    build: ./gateway
    restart: unless-stopped
    user: "0:0"
    # Root only for file ownership on the bind mounts (plan D5); everything else dropped.
    # Writable paths: /data/images, /comfy-output, /comfy-input (volumes) and /tmp (tmpfs); the image
    # sets PYTHONDONTWRITEBYTECODE so nothing else is written.
    cap_drop: [ALL]
    cap_add: [DAC_OVERRIDE, FOWNER]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: [/tmp]
    # Bounds Pillow preprocessing of uploads (MAX_INPUT_PIXELS x MAX_CONCURRENT_PREPROCESS).
    mem_limit: 2g
    depends_on:
      comfyui:
        condition: service_started
    # Explicit environment only (no env_file): HF_TOKEN / TUNNEL_TOKEN never reach the gateway.
    environment:
      COMFYUI_URL: http://comfyui:8188
      API_KEYS: ${API_KEYS:?set API_KEYS in .env}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      ENABLE_URL_FORMAT: ${ENABLE_URL_FORMAT:-true}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-sdxl}
      DEFAULT_RESPONSE_FORMAT: ${DEFAULT_RESPONSE_FORMAT:-b64_json}
      MAX_N: ${MAX_N:-4}
      MAX_PROMPT_CHARS: ${MAX_PROMPT_CHARS:-4000}
      MAX_BODY_BYTES: ${MAX_BODY_BYTES:-1048576}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-4194304}
      MAX_MULTIPART_BYTES: ${MAX_MULTIPART_BYTES:-0}
      MAX_INPUT_PIXELS: ${MAX_INPUT_PIXELS:-16777216}
      MAX_CONCURRENT_PREPROCESS: ${MAX_CONCURRENT_PREPROCESS:-2}
      UPLOAD_WAIT_S: ${UPLOAD_WAIT_S:-15}
      QUEUE_MAX_DEPTH: ${QUEUE_MAX_DEPTH:-8}
      REQUEST_TIMEOUT_S: ${REQUEST_TIMEOUT_S:-90}
      POSTPROCESS_RESERVE_S: ${POSTPROCESS_RESERVE_S:-10}
      EST_JOB_OVERHEAD_S: ${EST_JOB_OVERHEAD_S:-3}
      EST_EXTERNAL_JOB_S: ${EST_EXTERNAL_JOB_S:-30}
      POLL_INTERVAL_S: ${POLL_INTERVAL_S:-0.5}
      COMFY_QUEUE_POLL_S: ${COMFY_QUEUE_POLL_S:-2}
      IMAGE_STORE_DIR: /data/images
      IMAGE_URL_TTL_S: ${IMAGE_URL_TTL_S:-3600}
      COMFY_OUTPUT_DIR: /comfy-output
      COMFY_OUTPUT_SUBFOLDER: openai-api
      COMFY_INPUT_DIR: /comfy-input
      COMFY_INPUT_SUBFOLDER: openai-api
      CLEANUP_COMFY_OUTPUTS: ${CLEANUP_COMFY_OUTPUTS:-true}
      ORPHAN_MAX_AGE_S: ${ORPHAN_MAX_AGE_S:-3600}
      INPUT_ORPHAN_MAX_AGE_S: ${INPUT_ORPHAN_MAX_AGE_S:-300}
      MODEL_CHECK_TTL_S: ${MODEL_CHECK_TTL_S:-60}
      MODEL_REFRESH_MIN_INTERVAL_S: ${MODEL_REFRESH_MIN_INTERVAL_S:-5}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8001}:8000"
    volumes:
      - ./gateway-data/images:/data/images
      # Only the openai-api subfolders, never the whole ComfyUI output/input dirs.
      - ./comfyui/storage-user/output/openai-api:/comfy-output
      - ./comfyui/storage-user/input/openai-api:/comfy-input
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 15s
      timeout: 5s
      retries: 5

