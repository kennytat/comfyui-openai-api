[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "comfyui-openai-gateway"
version = "0.1.0"
description = "OpenAI-compatible Images API gateway in front of ComfyUI"
requires-python = ">=3.12"
dependencies = [
  # Pinned to the tested minors: app/uploads.py hooks private starlette MultiPartParser
  # internals (tests/test_edits.py asserts they exist).
  "fastapi>=0.165,<0.166",
  "starlette>=1.10,<1.11",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pillow>=10.3",
  # Multipart parser backend for the edits/variations routes.
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "openai>=1.40",
  "asgi-lifespan>=2.1",
  "pytest-cov>=5",
  "ruff>=0.5",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
